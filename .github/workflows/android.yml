name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-generator:
    name: License generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r license-generator/requirements.txt
      - run: python -m unittest discover -s tests -t .
        working-directory: license-generator

  license-manager-js:
    name: License manager (JavaScript) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r license-generator/requirements.txt   # for the JS <-> Python cross-check
      - run: node --test tests/*.test.js
        working-directory: license-manager

  android:
    name: Core tests, app unit tests, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Core (pure Kotlin) tests
        run: ./gradlew :core:test --stacktrace
      - name: App unit tests (Robolectric, in-memory Room)
        timeout-minutes: 20
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Inspect APK (signature, alignment, manifest)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          { echo "build-tools: $BT"
            "$BT/apksigner" verify --verbose --print-certs "$APK" || echo "APKSIGNER FAILED"
            "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -3 || echo "ZIPALIGN FAILED"
            "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable|native-code|uses-)" ; } > app/build/APK_CHECK.txt 2>&1
          cat app/build/APK_CHECK.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerInstallments-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish build outputs to the ci-artifacts branch
        if: github.event_name == 'push'
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out/screenshots /tmp/out/schemas
          cp app/build/outputs/apk/debug/*.apk /tmp/out/SmartManagerInstallments-debug.apk
          cp -r app/build/screenshots/. /tmp/out/screenshots/ 2>/dev/null || true
          cp app/build/APK_CHECK.txt /tmp/out/APK_CHECK.txt 2>/dev/null || true
          cp -r app/schemas/. /tmp/out/schemas/ 2>/dev/null || true
          python3 - <<'PY' > /tmp/out/TEST_SUMMARY.txt
          import glob, re
          for mod in ("core", "app"):
              t = f = e = s = 0
              for p in glob.glob(f"{mod}/build/test-results/**/*.xml", recursive=True):
                  m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(p, encoding="utf-8").read())
                  if m:
                      a, b, c, d = map(int, m.groups()); t += a; s += b; f += c; e += d
              print(f"{mod}: tests={t} failures={f} errors={e} skipped={s}")
          PY
          sha256sum /tmp/out/SmartManagerInstallments-debug.apk >> /tmp/out/TEST_SUMMARY.txt
          echo "commit: $GITHUB_SHA" >> /tmp/out/TEST_SUMMARY.txt
          cd /tmp/out && git init -q -b ci-artifacts && git add -A \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Build outputs for $GITHUB_SHA (DEBUG build, test license key only)" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-artifacts
      - name: Release build smoke test (throwaway license key, unsigned)
        run: |
          pip install -r license-generator/requirements.txt
          export SMI_LICGEN_PASSPHRASE=ci-throwaway-passphrase-not-a-secret
          (cd license-generator && python -m smilicgen --home "$RUNNER_TEMP/ci-gen" init-keys \
             && python -m smilicgen --home "$RUNNER_TEMP/ci-gen" export-public --out ../app/src/main/res/raw/license_public_key.pem)
          ./gradlew :app:assembleRelease --stacktrace
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "== permissions =="; "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" || true
          if "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" | grep -q INTERNET; then echo "INTERNET permission found!"; exit 1; fi
          echo "== key-like files inside the APK =="; unzip -l "$APK" | grep -i -E "pem|\.key|keystore" || true
          if unzip -l "$APK" | grep -i -E "signing_key|TEST_ONLY|keystore"; then echo "secret-looking file in APK!"; exit 1; fi
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug
        continue-on-error: true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/test-results
            core/build/test-results
            app/build/reports/lint-results-debug.html
            app/build/screenshots

  install-test:
    # Installs the freshly built debug APK on a real Android emulator and launches it (reports the exact installer error if any).
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartManagerInstallments-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash .github/ci/install-test.sh
