name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-generator:
    name: License generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r license-generator/requirements.txt
      - run: python -m unittest discover -s tests -t .
        working-directory: license-generator

  android:
    name: Core tests, app unit tests, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Core (pure Kotlin) tests
        run: ./gradlew :core:test --stacktrace
      - name: App unit tests (Robolectric, in-memory Room)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerInstallments-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Release build smoke test (throwaway license key, unsigned)
        run: |
          pip install -r license-generator/requirements.txt
          export SMI_LICGEN_PASSPHRASE=ci-throwaway-passphrase-not-a-secret
          (cd license-generator && python -m smilicgen --home "$RUNNER_TEMP/ci-gen" init-keys \
             && python -m smilicgen --home "$RUNNER_TEMP/ci-gen" export-public --out ../app/src/main/res/raw/license_public_key.pem)
          ./gradlew :app:assembleRelease --stacktrace
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "== permissions =="; "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" || true
          if "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" | grep -q INTERNET; then echo "INTERNET permission found!"; exit 1; fi
          echo "== key-like files inside the APK =="; unzip -l "$APK" | grep -i -E "pem|\.key|keystore" || true
          if unzip -l "$APK" | grep -i -E "signing_key|TEST_ONLY|keystore"; then echo "secret-looking file in APK!"; exit 1; fi
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug
        continue-on-error: true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/test-results
            core/build/test-results
            app/build/reports/lint-results-debug.html
            app/build/screenshots
